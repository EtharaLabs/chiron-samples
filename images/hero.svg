<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Chiron</title>
  <desc id="hero-desc">A centaur archer gallops left out of a field of dotted legacy code toward a city of crisp new code blocks, bow drawn. Its foreparts are built from code blocks and its hindquarters dissolve into dots. An archive of scrolls under a lamp, an anvil throwing sparks, and a glowing vessel over a flame attend the scene, lit from the upper left by a low moon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.6" stop-color="#131a33"/>
      <stop offset="1" stop-color="#1d2550"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="150" cy="96" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6c9ff" stop-opacity="0.55"/>
      <stop offset="0.22" stop-color="#845EF7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#845EF7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2350"/>
      <stop offset="1" stop-color="#080c20"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
