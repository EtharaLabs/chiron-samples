    <text x="892" y="276">int deflate(z_streamp strm, int flush);</text>
    <text x="900" y="306">goto fail;</text>
    <text x="960" y="336">./configure &amp;&amp; make install</text>
    <text x="910" y="366">@app.route('/get')</text>
    <text x="980" y="396">mvn -q package</text>
    <text x="920" y="426">router := gin.Default()</text>
    <text x="1000" y="456">python setup.py build_ext</text>
  </g>
