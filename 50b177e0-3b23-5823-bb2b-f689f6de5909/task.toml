schema_version = "1.4"
reward_type = "bounded_continuous"

[[artifacts]]
source = "/workspace/repo"
exclude = [
    "build",
    "build-*",
    "_build",
    "cmake-build*",
    "CMakeFiles",
    "CMakeCache.txt",
    "target",
    "*.o",
    "*.obj",
    "*.a",
    "*.so",
    "*.so.*",
    ".git",
]

[task]
name = "ethara/50b177e0-3b23-5823-bb2b-f689f6de5909"
version = "1.0.0"
description = "Move yyjson 0.13.0's implementation from C to Rust while keeping the public header, the C ABI, the CMake build, the installed tree and every observable behaviour unchanged."
authors = [{ name = "elhaan.daud", email = "elhaan.daud@ethara.ai" }]
keywords = ["migration", "language-rewrite", "c", "rust", "abi", "json", "cmake"]

[metadata]
platforms = ["linux/amd64", "linux/arm64"]
category = "language-rewrite"
license = "MIT"
upstream = "https://github.com/ibireme/yyjson"
state_a = "yyjson 0.13.0, C99, built and installed by CMake as a shared and a static library"
state_b = "the same library with its implementation in Rust (std, core and alloc only, no crates), the same public header, ABI, SONAME, installed tree and observable behaviour"
scale = "11480 lines of C implementation removed, 52 exported entry points preserved"
tags = ["abi-preserving", "byte-exact", "offline", "single-turn"]

[verifier]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]
environment_mode = "separate"

[verifier.env]
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[verifier.environment]
docker_image = "public.ecr.aws/d4u1d3p6/chiron:50b177e0-verifier@sha256:f55d8441eddcdaeec31c7f9d21ea847bd0dd5491c36c6a6626ab3b54e4bb2a1e"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[agent]
timeout_sec = 86400.0
network_mode = "no-network"
user = "1000"

[environment]
docker_image = "public.ecr.aws/d4u1d3p6/chiron:50b177e0-environment@sha256:16a3d0c232f53774b5f86bfd1a2f79af4658d771551b001dfdf2f84b1ee26875"
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 16384
storage_mb = 24576
gpus = 0
os = "linux"

[upstream_provenance]
origin = "original"
provenance_date = "2026-10-27"
source_kind = "public_repository"

[upstream_provenance.source]
canonical_repo = "github.com/ibireme/yyjson"
