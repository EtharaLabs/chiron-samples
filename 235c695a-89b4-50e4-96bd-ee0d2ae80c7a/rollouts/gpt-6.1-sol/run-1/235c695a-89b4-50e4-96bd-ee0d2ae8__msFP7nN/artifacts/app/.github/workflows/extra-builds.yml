name: Test extra build flows

on:
  pull_request:
  merge_group:
  #push:
  #  branches: [ main ]
  workflow_dispatch:

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.set_output.outputs.should_skip }}
    steps:
      - id: skip_check
        if: ${{ github.event_name != 'merge_group' }}
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # don't run on documentation changes
          paths_ignore: '["**/README.md", "docs/**", "guidelines/**"]'
          # cancel previous builds if a new commit is pushed
          # but never cancel main
          cancel_others: ${{ github.ref != 'refs/heads/main' }}

      - id: set_output
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
          else
            echo "should_skip=${{ steps.skip_check.outputs.should_skip }}" >> $GITHUB_OUTPUT
          fi

  vs-build:
    name: Visual Studio build
    runs-on: windows-latest
    needs: [pre_job]
    if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Build dependencies
        run: |
          choco install winflexbison3 -y
          vcpkg install zlib:x64-windows-static
      - name: Configure
        run: >-
          cmake -B build -T v142 -DCMAKE_SYSTEM_VERSION=10.0.26100.0
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DFLEX_INCLUDE_DIR="$env:ChocolateyInstall/lib/winflexbison3/tools"
          -DBUILD_TESTING=OFF -DYOSYS_WITHOUT_TCL=ON -DYOSYS_WITHOUT_READLINE=ON
          -DYOSYS_WITHOUT_PLUGINS=ON -DYOSYS_ABC_EXTERNAL=yosys-abc.exe .
      - name: Build
        run: cmake --build build --target yosys --config Release --parallel

  wasi-build:
    name: WASI build
    needs: pre_job
    if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Build
        run: |
          WASI_SDK=wasi-sdk-33.0-x86_64-linux
          WASI_SDK_URL=https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          if ! [ -d ${WASI_SDK} ]; then curl -L ${WASI_SDK_URL} | tar xzf -; fi

          FLEX_VER=2.6.4
          FLEX=flex-${FLEX_VER}
          FLEX_URL=https://github.com/westes/flex/releases/download/v${FLEX_VER}/${FLEX}.tar.gz
          if ! [ -d ${FLEX} ]; then curl -L ${FLEX_URL} | tar xzf -; fi

          mkdir -p flex-build
          (cd flex-build &&
            ../${FLEX}/configure --prefix=$(pwd)/../flex-prefix &&
            make &&
            make install)

          export PATH="$(pwd)/${WASI_SDK}/bin:$PATH"
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$(pwd)/${WASI_SDK}/share/cmake/wasi-sdk-p1.cmake" -DCMAKE_INSTALL_PREFIX=/ -DYOSYS_WITHOUT_TCL=ON -DYOSYS_WITHOUT_READLINE=ON -DYOSYS_WITHOUT_PLUGINS=ON -DYOSYS_WITHOUT_ZLIB=ON -DCMAKE_CXX_FLAGS="-I$(pwd)/flex-prefix/include" "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,stack-size=8388608 -Wl,--stack-first -Wl,--strip-all" .
          cmake --build build -j$(nproc)

  nix-build:
    name: "Build nix flake"
    needs: pre_job
    if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.30.0/install
      - run: nix build .?submodules=1 -L

  extra-builds-result:
    runs-on: ubuntu-latest
    needs:
      - vs-build
      - wasi-build
      - nix-build
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Needs results: ${{ join(needs.*.result, ',') }}"
          if [[ "${{ join(needs.*.result, ',') }}" == *failure* ]] || \
            [[ "${{ join(needs.*.result, ',') }}" == *cancelled* ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
      - run: echo "All good"
