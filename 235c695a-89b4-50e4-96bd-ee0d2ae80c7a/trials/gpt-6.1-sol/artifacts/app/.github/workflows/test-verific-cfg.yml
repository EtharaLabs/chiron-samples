name: Build various Verific configurations

on:
  workflow_dispatch:

jobs:
  test-verific-cfg:
    if: github.repository_owner == 'YosysHQ'
    runs-on: [self-hosted, linux, x64, fast]
    steps:
      - name: Checkout Yosys
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Runtime environment
        run: |
          echo "procs=$(nproc)" >> $GITHUB_ENV

      - name: verific [SV]
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DYOSYS_ENABLE_VERIFIC=ON -DYOSYS_ENABLE_VERIFIC_SYSTEMVERILOG=ON -DYOSYS_ENABLE_VERIFIC_VHDL=OFF -DYOSYS_ENABLE_VERIFIC_HIER_TREE=OFF -DYOSYS_ENABLE_VERIFIC_EDIF=OFF -DYOSYS_ENABLE_VERIFIC_LIBERTY=OFF -DYOSYS_ENABLE_VERIFIC_YOSYSHQ_EXTENSIONS=OFF -DYOSYS_ENABLE_CCACHE=ON
          cmake --build build -j$procs

      - name: verific [VHDL]
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DYOSYS_ENABLE_VERIFIC=ON -DYOSYS_ENABLE_VERIFIC_SYSTEMVERILOG=OFF -DYOSYS_ENABLE_VERIFIC_VHDL=ON -DYOSYS_ENABLE_VERIFIC_HIER_TREE=OFF -DYOSYS_ENABLE_VERIFIC_EDIF=OFF -DYOSYS_ENABLE_VERIFIC_LIBERTY=OFF -DYOSYS_ENABLE_VERIFIC_YOSYSHQ_EXTENSIONS=OFF -DYOSYS_ENABLE_CCACHE=ON
          cmake --build build -j$procs

      - name: verific [SV + VHDL]
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DYOSYS_ENABLE_VERIFIC=ON -DYOSYS_ENABLE_VERIFIC_SYSTEMVERILOG=ON -DYOSYS_ENABLE_VERIFIC_VHDL=ON -DYOSYS_ENABLE_VERIFIC_HIER_TREE=OFF -DYOSYS_ENABLE_VERIFIC_EDIF=OFF -DYOSYS_ENABLE_VERIFIC_LIBERTY=OFF -DYOSYS_ENABLE_VERIFIC_YOSYSHQ_EXTENSIONS=OFF -DYOSYS_ENABLE_CCACHE=ON
          cmake --build build -j$procs

      - name: verific [SV + HIER]
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DYOSYS_ENABLE_VERIFIC=ON -DYOSYS_ENABLE_VERIFIC_SYSTEMVERILOG=ON -DYOSYS_ENABLE_VERIFIC_VHDL=OFF -DYOSYS_ENABLE_VERIFIC_HIER_TREE=ON -DYOSYS_ENABLE_VERIFIC_EDIF=OFF -DYOSYS_ENABLE_VERIFIC_LIBERTY=OFF -DYOSYS_ENABLE_VERIFIC_YOSYSHQ_EXTENSIONS=OFF -DYOSYS_ENABLE_CCACHE=ON
          cmake --build build -j$procs

      - name: verific [VHDL + HIER]
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DYOSYS_ENABLE_VERIFIC=ON -DYOSYS_ENABLE_VERIFIC_SYSTEMVERILOG=OFF -DYOSYS_ENABLE_VERIFIC_VHDL=ON -DYOSYS_ENABLE_VERIFIC_HIER_TREE=ON -DYOSYS_ENABLE_VERIFIC_EDIF=OFF -DYOSYS_ENABLE_VERIFIC_LIBERTY=OFF -DYOSYS_ENABLE_VERIFIC_YOSYSHQ_EXTENSIONS=OFF -DYOSYS_ENABLE_CCACHE=ON
          cmake --build build -j$procs

      - name: verific [SV + VHDL + HIER]
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DYOSYS_ENABLE_VERIFIC=ON -DYOSYS_ENABLE_VERIFIC_SYSTEMVERILOG=ON -DYOSYS_ENABLE_VERIFIC_VHDL=ON -DYOSYS_ENABLE_VERIFIC_HIER_TREE=ON -DYOSYS_ENABLE_VERIFIC_EDIF=OFF -DYOSYS_ENABLE_VERIFIC_LIBERTY=OFF -DYOSYS_ENABLE_VERIFIC_YOSYSHQ_EXTENSIONS=OFF -DYOSYS_ENABLE_CCACHE=ON
          cmake --build build -j$procs

      - name: verific [SV + VHDL + HIER + EDIF + LIBERTY]
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DYOSYS_ENABLE_VERIFIC=ON -DYOSYS_ENABLE_VERIFIC_SYSTEMVERILOG=ON -DYOSYS_ENABLE_VERIFIC_VHDL=ON -DYOSYS_ENABLE_VERIFIC_HIER_TREE=ON -DYOSYS_ENABLE_VERIFIC_EDIF=ON -DYOSYS_ENABLE_VERIFIC_LIBERTY=ON -DYOSYS_ENABLE_VERIFIC_YOSYSHQ_EXTENSIONS=OFF -DYOSYS_ENABLE_CCACHE=ON
          cmake --build build -j$procs
