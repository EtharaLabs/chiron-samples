coverage_gaps:
  - {"text": "Incremental reading past completion is undefined behaviour in State A, not an error path, so no case exercises it."}
  - {"text": "State A's \"number too long\" message is unreachable through the public API, because truncation is reported first."}
  - {"text": "YYJSON_READ_ERROR_DEPTH never compiles at the default depth limits, so no case reaches it."}
  - {"text": "Permission-denied file paths are left out of the file module: the outcome depends on the effective user id, which would fail a correct port."}
  - {"text": "unsafe_yyjson_mut_str_alc with a null document and unsafe_yyjson_mut_strncpy with a null string are unguarded in State A, so neither is compared."}
  - {"text": "yyjson_mem_* and yyjson_strlen are not declared in the public header and are not part of the compared surface."}
  - {"text": "The scratch contents of a failing buffer writer are undocumented in State A and are not compared."}
  - {"text": "Stage 3 separates no mutant in mutable list surgery or the merge-patch walk: array ordering, duplicate-key handling, rotation, renaming, merge-patch sequences, raw and no-escape writing, the non-copying string constructors and pointer parent creation are exercised but discriminate nothing. Stage 2 modules B-05, B-06 and B-07 cover them."}
  - {"text": "Stage 3 separates no mutant in incremental reading, file input and output, or the pool and dynamic allocators; stage 2 modules B-07, B-08 and B-10 cover them."}
  - {"text": "Fourteen of the one hundred and four mutants survive the stage-3 corpus. Three are output-equivalent by construction. Six are rounding decisions no candidate reached. Two turn a bounds guard into an out-of-bounds read observable only for bytes outside the buffer. One needs an array of 10^18 elements. Two are reachable only within one chunk header of the maximum object size."}
  - {"text": "The verbatim-span relation behind P-06 does not detect a transformed embedding of State A's implementation, such as a base64, compressed or reformatted copy. The judged note and the Phase attack anti-shortcut lane are the remaining defences."}
  - {"text": "T-04 compares installed paths, kinds and link targets rather than the contents of the CMake export set; wrong contents are separated instead by the consumer module's find_package route."}
  - {"text": "T-17 compares installed bytes after folding the install prefix string, because the pkg-config file and the CMake package configuration legitimately record their own prefix."}
  - {"text": "P-03 reads the shared library's dynamic imports; the static archive's undefined symbols are not an import relation and are not read."}
  - {"text": "The reference port is verified on linux/arm64 only. State A's ten behavioural record files are byte-identical on linux/amd64 and both images build for both platforms, but rustc cannot run under the authoring host's emulator, so the port itself was not exercised there. The frozen baseline is recorded per platform inside the verifier image, so an amd64-only difference would surface as an oracle control failure rather than as a wrong baseline."}
  - {"text": "T-05 is a subset relation, so a shipped library declaring no dynamic dependency at all would satisfy it. No working submission can avoid the C runtime, so the relation is left as the contract binds it."}
  - {"text": "The static archive carries rustc's compiler-builtins members, so it holds 406 members and 603 defined global text symbols against State A's single member with 52. Exactly 52 carry default visibility and 551 are hidden, so a final link still exports State A's set, and no compiled criterion reads archive membership."}

