[task]
name = "ethara/78f33146-cdab-57ce-83fd-5f2e030dd52c"
version = "0.1.0"
description = "Upgrade the datalab research data management server from pydantic 1 to pydantic 2 with every served behaviour unchanged, offline against a fixed wheel set."
authors = [{ name = "elhaan.daud", email = "elhaan.daud@ethara.ai" }]
keywords = ["dependency-upgrade", "pydantic", "framework-rewrite", "flask", "mongodb", "migration"]

[metadata]
platforms = ["linux/amd64", "linux/arm64"]
category = "dependency-upgrade"
license = "MIT"
upstream = "https://github.com/datalab-org/datalab"
state_a = "the datalab server on Pydantic 1, with Flask and MongoDB"
state_b = "the same server on Pydantic 2 (2.13.4, pydantic-core 2.46.4, pydantic-settings 2.15.0) with every served behaviour unchanged, offline against a fixed wheel set"
scale = "117 deprecated Pydantic 1 alias sites in the original; the reference migration changes 63 files (+7,027 -3,955 lines)"
tags = ["behaviour-preserving", "offline", "single-turn"]

